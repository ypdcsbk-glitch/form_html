<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="title">Registration Form</h1>

    <form>
        <div class="form">
        <label for="firstname">First Name:</label> &nbsp; &nbsp;  
        <input type="text" id="firstname" placeholder="enter your name" required><br><br>

        <label for="lastname">Last Name:</label> &nbsp; &nbsp;
        <input type="text" id="lastname" placeholder="enter your last name" required><br><br>

        <label for="email">Email:</label> &nbsp; &nbsp;
        <input type="email" id="email" placeholder="enter your email" required><br><br>

        <label for="age">Age:</label> &nbsp; &nbsp;
        <input type="number" id="age" placeholder="enter your age" required><br><br>

        <label for="dob">Date of Birth:</label> &nbsp; &nbsp;
        <input type="date" id="dob" required><br><br>

        <label for="phonenumber">Phone Number:</label> &nbsp; &nbsp;
        <input type="number" id="phonename" required><br><br>

        <label for="password">Password:</label> &nbsp; &nbsp;
        <input type="password" id="password" required><br><br>

        <label>Gender:</label><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender"><br><br>

        <label>Department</label><br>
        <input type="checkbox" id="CSE">
        <label for="CSE">CSE</label>
        <input type="checkbox" id="IT">

        <label for="IT">IT</label>
        <input type="checkbox" id="ECE">

        <label for="ECE">ECE</label>
        <input type="checkbox" id="Civil">

        <label for="Civil">Civil</label><br><br>

        <label for="province">Province</label> &nbsp; &nbsp;
        <select name="province" id="province">
            <option value="Sindh">Sindh</option>
            <option value="KPK">KPK</option>
            <option value="Baluchistan">Baluchistan</option>
            <option value="Punjab">Punjab</option>
        </select><br><br>

        <label for="studentpic">Student Photo</label> &nbsp; &nbsp;
        <input type="file" id="studentpic"><br><br>

        <label for="address">Address</label><br>
        <textarea id="address"></textarea>
        <label for="livelocation"></label><br>
        <iframe width="400" height="300"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3449.20823684874!2d66.966012974166!3d30.174045012421107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ed2e0c0c524c463%3A0xb98384ae907e44c6!2sKirani%20Rd%2C%20Quetta%2C%20Pakistan!5e0!3m2!1sen!2s!4v1790617794374!5m2!1sen!2s"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <br><br>

        <iframe width="400" height="315" src="https://www.youtube.com/embed/TCEgdiN0A8s?si=aShzL36L1VhMOvv3"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>




        <br><br>

        <label class="button" for="submit"></label>
        <button type="submit">Register</button>
        </div>
    </form>



</body>

</html>
